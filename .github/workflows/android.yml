name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS: ${{ secrets.CANASTRA_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes do motor do jogo
        run: |
          T="$RUNNER_TEMP/web-tests"; mkdir -p "$T"
          cp app/src/main/assets/www/* web-tests/*.mjs "$T"
          cd "$T"; for t in test*.mjs; do node "$t"; done

      - name: APK de teste (debug)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: canastra-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Release assinado (só roda se os secrets estiverem configurados no repositório)
      - name: Preparar keystore
        if: ${{ env.KS != '' }}
        run: echo "$KS" | base64 -d > canastra-release.jks

      - name: AAB + APK de release
        if: ${{ env.KS != '' }}
        env:
          CANASTRA_KEYSTORE_PATH: canastra-release.jks
          CANASTRA_KEYSTORE_PASSWORD: ${{ secrets.CANASTRA_KEYSTORE_PASSWORD }}
          CANASTRA_KEY_ALIAS: ${{ secrets.CANASTRA_KEY_ALIAS }}
          CANASTRA_KEY_PASSWORD: ${{ secrets.CANASTRA_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        if: ${{ env.KS != '' }}
        with:
          name: canastra-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
